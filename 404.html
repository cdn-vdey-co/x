<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>My Page</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: auto;
    }
    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .screen.active { display: flex; }

    /* Halaman pembuka */
    #intro {
      min-height: calc(100svh - 36px);
      gap: 9px;
    }
    .loading-label {
      color: #bdbdbd;
      font-size: 12px;
      letter-spacing: 1.3px;
    }
    .dots span {
      display: inline-block;
      animation: dot 1.1s infinite ease-in-out;
      opacity: .25;
    }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes dot {
      0%, 60%, 100% { opacity: .2; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    /* Halaman utama */
    #main {
      width: 100vw;
      height: 100svh;
      min-height: 100svh;
      gap: 0;
      overflow: hidden;
    }
    .content {
      position: relative;
      width: 100vw;
      height: 100svh;
      transform: none;
      display: block;
      overflow: hidden;
      background: #000;
    }
    .video-frame {
      position: absolute;
      top: 5svh;
      left: 0;
      width: 100%;
      height: 90svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      border-radius: 0;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: contain;
      background: #000;
    }
    video::-webkit-media-controls-fullscreen-button { display: none !important; }
    video::-webkit-media-controls-overflow-button { display: none !important; }
    .floating-cta {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 50%;
      width: min(66vw, 340px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: translate(-50%, -50%);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      will-change: left, top;
    }
    .floating-cta.dragging { cursor: grabbing; }
    .hint {
      margin: 0;
      color: #f0f0f0;
      font-size: 14px;
      line-height: 1.3;
      letter-spacing: .15px;
      text-align: center;
      text-shadow: 0 1px 5px #000;
      white-space: nowrap;
      pointer-events: none;
    }
    .hint .point-down {
      display: inline-block;
      animation: point-bob .42s ease-in-out infinite alternate;
    }
    @keyframes point-bob {
      from { transform: translateY(-3px); }
      to { transform: translateY(3px); }
    }
    .telegram-button {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 16px;
      border-radius: 10px;
      background: #ec238b;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      transition: background .15s ease;
      touch-action: manipulation;
    }
    .telegram-button:hover { background: #d81779; }
    .telegram-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      .dots span { animation: none; opacity: 1; }
      .hint .point-down { animation: none; }
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>

    // Pilih acak dan usahakan tidak memilih video yang sama dengan kunjungan sebelumnya.
    function getShuffledVideoList(urls) {
      const validUrls = [...new Set(urls.map(url => url.trim())
        .filter(url => url && /^https:\/\//i.test(url) && !url.includes("contoh.com")))];

      // Acak urutan; setiap URL dicoba maksimal sekali dalam satu kunjungan.
      for (let i = validUrls.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [validUrls[i], validUrls[j]] = [validUrls[j], validUrls[i]];
      }

      // Usahakan video pertama berbeda dari kunjungan sebelumnya.
      let previous = "";
      try { previous = sessionStorage.getItem("myPagePreviousVideo") || ""; } catch (e) {}
      if (validUrls.length > 1 && validUrls[0] === previous) {
        const other = validUrls.findIndex(url => url !== previous);
        if (other > 0) [validUrls[0], validUrls[other]] = [validUrls[other], validUrls[0]];
      }
      return validUrls;
    }

    function startVideoWithFallback(video, urls) {
      const queue = getShuffledVideoList(urls);
      let nextIndex = 0;
      let timer = null;
      let status = document.getElementById("videoStatus");

      if (!status) {
        status = document.createElement("p");
        status.id = "videoStatus";
        status.className = "hint";
        video.parentElement.insertAdjacentElement("afterend", status);
      }

      function tryNext() {
        clearTimeout(timer);
        video.oncanplay = null;
        video.onerror = null;

        if (nextIndex >= queue.length) {
          video.pause();
          video.removeAttribute("src");
          video.load();
          status.textContent = "Video belum tersedia. Silakan coba lagi nanti.";
          return;
        }

        const url = queue[nextIndex++];
        let settled = false;
        // status.textContent = "Menyiapkan video…";
        video.muted = true;
        video.src = url;
        video.load();

        function failed() {
          if (settled) return;
          settled = true;
          tryNext();
        }

        function ready() {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          video.oncanplay = null;
          video.onerror = null;
          status.textContent = "";

          try { sessionStorage.setItem("myPagePreviousVideo", url); } catch (e) {}

          const playAttempt = video.play();
          if (playAttempt && typeof playAttempt.catch === "function") {
            playAttempt.catch(() => {
              // Jika autoplay dibatasi browser, pengunjung tetap dapat menekan Play.
            });
          }
        }

        video.oncanplay = ready;
        video.onerror = failed;

        // Jika tidak siap dalam 12 detik, lanjut mencoba URL lain.
        timer = setTimeout(failed, 12000);
      }

      if (queue.length === 0) {
        status.textContent = "Tambahkan direct link MP4 ke daftar VIDEO_URLS di file HTML.";
        return;
      }
      tryNext();
    }

    // Orbit CTA di dalam layar video; sentuhan menghentikan orbit dan mengaktifkan drag.
    const floatingCta = document.getElementById("floatingCta");
    const videoFrame = document.querySelector(".video-frame");
    let orbitActive = true, orbitStart = 0, dragState = null, suppressNextClick = false;

    function clampCta(x, y) {
      const f = videoFrame.getBoundingClientRect();
      const r = floatingCta.getBoundingClientRect();
      return {
        x: Math.max(r.width / 2, Math.min(f.width - r.width / 2, x)),
        y: Math.max(r.height / 2, Math.min(f.height - r.height / 2, y))
      };
    }

    function animateCta(now) {
      if (!orbitStart) orbitStart = now;
      if (orbitActive && !dragState) {
        const f = videoFrame.getBoundingClientRect();
        const r = floatingCta.getBoundingClientRect();
        const t = (now - orbitStart) / 1000;
        floatingCta.style.left = (f.width / 2 + (f.width-r.width) * .39 * Math.cos(t*.42)) + "px";
        floatingCta.style.top = (f.height / 2 + (f.height-r.height) * .39 * Math.sin(t*.63)) + "px";
      }
      requestAnimationFrame(animateCta);
    }
    requestAnimationFrame(animateCta);

    floatingCta.addEventListener("pointerdown", e => {
      orbitActive = false;
      const f = videoFrame.getBoundingClientRect(), r = floatingCta.getBoundingClientRect();
      dragState = { id:e.pointerId, sx:e.clientX, sy:e.clientY,
        ox:r.left-f.left+r.width/2, oy:r.top-f.top+r.height/2, moved:false };
      floatingCta.classList.add("dragging");
      floatingCta.setPointerCapture(e.pointerId);
    });
    floatingCta.addEventListener("pointermove", e => {
      if (!dragState || dragState.id !== e.pointerId) return;
      const dx=e.clientX-dragState.sx, dy=e.clientY-dragState.sy;
      if (Math.abs(dx)+Math.abs(dy)>6) dragState.moved=true;
      const pos=clampCta(dragState.ox+dx, dragState.oy+dy);
      floatingCta.style.left=pos.x+"px";
      floatingCta.style.top=pos.y+"px";
    });
    function endCtaDrag(e) {
      if (!dragState || dragState.id !== e.pointerId) return;
      suppressNextClick=dragState.moved;
      dragState=null;
      floatingCta.classList.remove("dragging");
    }
    floatingCta.addEventListener("pointerup", endCtaDrag);
    floatingCta.addEventListener("pointercancel", endCtaDrag);
    floatingCta.addEventListener("click", e => {
      if (suppressNextClick) { e.preventDefault(); suppressNextClick=false; }
    });

    // Jeda tampilan pembuka (1.5 detik), bukan proses loading.
    window.setTimeout(() => {
      document.getElementById('intro').classList.remove('active');
      document.getElementById('main').classList.add('active');

      const video = document.getElementById('pageVideo');
      startVideoWithFallback(video, VIDEO_URLS);
    }, 1500);
